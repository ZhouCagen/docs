<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550"><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="340" y="35" font-size="24" fill="#24344b" text-anchor="middle">栈增长与保护区域</text><text x="90" y="69" font-size="16" fill="#24344b" text-anchor="start">高地址</text><rect x="90" y="86" width="500" height="90" rx="8" fill="#dbeafe" stroke="#b7c5d6"/><text x="340" y="119" font-size="20" fill="#24344b" text-anchor="middle">用户栈</text><text x="340" y="149" font-size="16" fill="#24344b" text-anchor="middle">↓ 向低地址增长</text><rect x="90" y="184" width="500" height="100" rx="8" fill="#f8fafc" stroke="#b7c5d6"/><text x="340" y="217" font-size="20" fill="#24344b" text-anchor="middle">预留的未映射空间</text><text x="340" y="247" font-size="16" fill="#24344b" text-anchor="middle">满足条件时，操作系统可扩展栈映射</text><rect x="90" y="292" width="500" height="86" rx="8" fill="#fee2e2" stroke="#b7c5d6"/><text x="340" y="325" font-size="20" fill="#24344b" text-anchor="middle">guard page / 保护区域</text><text x="340" y="355" font-size="16" fill="#24344b" text-anchor="middle">故意禁止访问，越界触发异常</text><rect x="90" y="386" width="500" height="78" rx="8" fill="#e2e8f0" stroke="#b7c5d6"/><text x="340" y="419" font-size="20" fill="#24344b" text-anchor="middle">其他映射区</text><text x="340" y="449" font-size="16" fill="#24344b" text-anchor="middle">与栈保持隔离</text><text x="90" y="490" font-size="16" fill="#24344b" text-anchor="start">低地址</text><text x="340" y="525" font-size="15" fill="#24344b" text-anchor="middle">示意布局；保护区域的位置和大小取决于实现。</text></g></svg>