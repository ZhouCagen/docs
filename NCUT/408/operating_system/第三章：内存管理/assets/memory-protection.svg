<svg xmlns="http://www.w3.org/2000/svg" width="720" height="495" viewBox="0 0 720 495"><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="360" y="35" font-size="24" fill="#24344b" text-anchor="middle">先检查边界，再转换地址</text><rect x="70" y="65" width="410" height="70" rx="8" fill="#dbeafe" stroke="#b7c5d6"/><text x="275" y="108" font-size="19" fill="#24344b" text-anchor="middle">CPU 产生逻辑地址 a</text><rect x="70" y="165" width="410" height="70" rx="8" fill="#fef3c7" stroke="#b7c5d6"/><text x="275" y="193" font-size="19" fill="#24344b" text-anchor="middle">检查：0 ≤ a &lt; L</text><text x="275" y="219" font-size="15" fill="#24344b" text-anchor="middle">L 来自界地址寄存器（长度）</text><rect x="70" y="300" width="410" height="70" rx="8" fill="#dcfce7" stroke="#b7c5d6"/><text x="275" y="328" font-size="19" fill="#24344b" text-anchor="middle">合法：物理地址 = B + a</text><text x="275" y="354" font-size="15" fill="#24344b" text-anchor="middle">B 来自重定位寄存器（基址）</text><rect x="70" y="400" width="410" height="70" rx="8" fill="#dbeafe" stroke="#b7c5d6"/><text x="275" y="443" font-size="19" fill="#24344b" text-anchor="middle">访问内存</text><rect x="520" y="165" width="160" height="70" rx="8" fill="#fee2e2" stroke="#b7c5d6"/><text x="600" y="207" font-size="20" fill="#24344b" text-anchor="middle">越界异常</text><path d="M275 135 V157" stroke="#64748b" stroke-width="2" fill="none"/><path d="M270 156 L275 163 L280 156" fill="none" stroke="#64748b" stroke-width="2"/><path d="M275 235 V292" stroke="#64748b" stroke-width="2" fill="none"/><path d="M270 291 L275 298 L280 291" fill="none" stroke="#64748b" stroke-width="2"/><path d="M275 370 V392" stroke="#64748b" stroke-width="2" fill="none"/><path d="M270 391 L275 398 L280 391" fill="none" stroke="#64748b" stroke-width="2"/><path d="M480 200 H515 M508 195 L515 200 L508 205" fill="none" stroke="#64748b" stroke-width="2"/><text x="505" y="186" font-size="15" fill="#24344b" text-anchor="middle">否</text><text x="295" y="272" font-size="16" fill="#24344b" text-anchor="middle">是</text></g></svg>