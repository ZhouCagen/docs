<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" role="img" aria-labelledby="title desc">
  <title id="title">超时与快恢复对拥塞窗口的影响</title>
  <desc id="desc">横轴从第0轮开始，纵轴以MSS为单位。初始门限为16。第12轮窗口达到24后超时，第1次调整门限为12，第13轮窗口回到1并重新慢开始，第17轮窗口达到12后转为拥塞避免。第21轮窗口为16时收到3个重复ACK，第2次调整门限为8，第22轮窗口减为8，此后按拥塞避免每轮加1。图中采用省略Reno临时窗口膨胀的教材简化模型。</desc>
