<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TCP 报文段格式（教材基本首部）</title>
  <desc id="desc">TCP 固定首部为 20 字节。源目的端口各 16 位，序号确认号各 32 位，数据偏移 4 位，保留 6 位，URG ACK PSH RST SYN FIN 各 1 位，窗口检验和紧急指针各 16 位。下接选项与填充及数据部分。</desc>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #243247; text-anchor: middle; }
    .title { font-size: 26px; font-weight: 700; }
    .label { font-size: 23px; }
    .note { font-size: 17px; fill: #64748b; }
    .bit { font-family: monospace; font-size: 13px; fill: #64748b; }
    .flag { font-family: monospace; font-size: 17px; font-weight: 600; }
    .field { stroke: #475569; stroke-width: 1.5; }
  </style>
  <rect width="1200" height="760" rx="12" fill="#fff"/>
  <text x="560" y="40" class="title">TCP 报文段格式（教材基本首部）</text>
  <text x="560" y="70" class="note">每行 32 bit（4B） · 上方数字为位编号</text>
  <text x="95" y="99" class="bit">0</text>
  <text x="125" y="99" class="bit">1</text>
  <text x="155" y="99" class="bit">2</text>
  <text x="185" y="99" class="bit">3</text>
  <text x="215" y="99" class="bit">4</text>
  <text x="245" y="99" class="bit">5</text>
  <text x="275" y="99" class="bit">6</text>
  <text x="305" y="99" class="bit">7</text>
  <text x="335" y="99" class="bit">8</text>
  <text x="365" y="99" class="bit">9</text>
  <text x="395" y="99" class="bit">10</text>
  <text x="425" y="99" class="bit">11</text>
  <text x="455" y="99" class="bit">12</text>
  <text x="485" y="99" class="bit">13</text>
  <text x="515" y="99" class="bit">14</text>
  <text x="545" y="99" class="bit">15</text>
  <text x="575" y="99" class="bit">16</text>
  <text x="605" y="99" class="bit">17</text>
  <text x="635" y="99" class="bit">18</text>
  <text x="665" y="99" class="bit">19</text>
  <text x="695" y="99" class="bit">20</text>
  <text x="725" y="99" class="bit">21</text>
  <text x="755" y="99" class="bit">22</text>
  <text x="785" y="99" class="bit">23</text>
  <text x="815" y="99" class="bit">24</text>
  <text x="845" y="99" class="bit">25</text>
  <text x="875" y="99" class="bit">26</text>
  <text x="905" y="99" class="bit">27</text>
  <text x="935" y="99" class="bit">28</text>
  <text x="965" y="99" class="bit">29</text>
  <text x="995" y="99" class="bit">30</text>
  <text x="1025" y="99" class="bit">31</text>
  <rect x="80" y="112" width="480" height="72" fill="#f0f6ff" class="field"/>
  <text x="320" y="144" class="label">源端口号</text>
  <text x="320" y="171" class="note">16 bit</text>
  <rect x="560" y="112" width="480" height="72" fill="#f0f6ff" class="field"/>
  <text x="800" y="144" class="label">目的端口号</text>
  <text x="800" y="171" class="note">16 bit</text>
  <rect x="80" y="184" width="960" height="72" fill="#f0f6ff" class="field"/>
  <text x="560" y="216" class="label">序号 seq</text>
  <text x="560" y="243" class="note">32 bit</text>
  <rect x="80" y="256" width="960" height="72" fill="#f0f6ff" class="field"/>
  <text x="560" y="288" class="label">确认号 ack</text>
  <text x="560" y="315" class="note">32 bit</text>
  <rect x="80" y="328" width="120" height="100" fill="#f0f6ff" class="field"/>
  <text x="140" y="374" class="label">数据偏移</text>
  <text x="140" y="401" class="note">4 bit</text>
  <rect x="200" y="328" width="180" height="100" fill="#f0f6ff" class="field"/>
  <text x="290" y="374" class="label">保留</text>
  <text x="290" y="401" class="note">6 bit</text>
  <rect x="380" y="328" width="30" height="100" fill="#e0edff" class="field"/>
  <text x="395" y="358" class="flag">U</text>
  <text x="395" y="380" class="flag">R</text>
  <text x="395" y="402" class="flag">G</text>
  <rect x="410" y="328" width="30" height="100" fill="#e0edff" class="field"/>
  <text x="425" y="358" class="flag">A</text>
  <text x="425" y="380" class="flag">C</text>
  <text x="425" y="402" class="flag">K</text>
  <rect x="440" y="328" width="30" height="100" fill="#e0edff" class="field"/>
  <text x="455" y="358" class="flag">P</text>
  <text x="455" y="380" class="flag">S</text>
  <text x="455" y="402" class="flag">H</text>
  <rect x="470" y="328" width="30" height="100" fill="#e0edff" class="field"/>
  <text x="485" y="358" class="flag">R</text>
  <text x="485" y="380" class="flag">S</text>
  <text x="485" y="402" class="flag">T</text>
  <rect x="500" y="328" width="30" height="100" fill="#e0edff" class="field"/>
  <text x="515" y="358" class="flag">S</text>
  <text x="515" y="380" class="flag">Y</text>
  <text x="515" y="402" class="flag">N</text>
  <rect x="530" y="328" width="30" height="100" fill="#e0edff" class="field"/>
  <text x="545" y="358" class="flag">F</text>
  <text x="545" y="380" class="flag">I</text>
  <text x="545" y="402" class="flag">N</text>
  <rect x="560" y="328" width="480" height="100" fill="#f0f6ff" class="field"/>
  <text x="800" y="374" class="label">窗口</text>
  <text x="800" y="401" class="note">16 bit</text>
  <rect x="80" y="428" width="480" height="72" fill="#f0f6ff" class="field"/>
  <text x="320" y="460" class="label">检验和</text>
  <text x="320" y="487" class="note">16 bit</text>
  <rect x="560" y="428" width="480" height="72" fill="#f0f6ff" class="field"/>
  <text x="800" y="460" class="label">紧急指针</text>
  <text x="800" y="487" class="note">16 bit</text>
  <rect x="80" y="500" width="960" height="72" fill="#f8fafc" class="field"/>
  <text x="560" y="532" class="label">选项与填充（如有）</text>
  <text x="560" y="559" class="note">0～40B，首部总长度为 4B 的整数倍</text>
  <rect x="80" y="572" width="960" height="80" fill="#f8fafc" class="field"/>
  <text x="560" y="608" class="label">数据部分</text>
  <text x="560" y="635" class="note">长度可变，图中高度仅作示意</text>
  <path d="M1060 112 h16 V500 h-16" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="1106" y="306" class="note" transform="rotate(90 1106 306)">固定首部 20B</text>
  <text x="560" y="694" class="note">每个控制位占 1 bit；本图按教材的 6 位保留字段与 6 个控制位绘制</text>
  <text x="560" y="724" class="note">数据偏移以 4B 为单位：最小值 5，最大值 15</text>
</svg>
