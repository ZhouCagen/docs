<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" role="img" aria-labelledby="title desc">
  <title id="title">慢开始和拥塞避免算法的实现过程</title>
  <desc id="desc">横轴从第0轮开始，纵轴为拥塞窗口，以MSS为单位。第0至4轮窗口为1、2、4、8、16，之后线性增至第12轮的24。发生超时后，门限从16减为12，第13轮窗口回到1；第13至17轮为1、2、4、8、12，之后继续线性增长。灰色区域标出慢开始和拥塞避免，双向箭头表示门限减半。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#292929"/></marker>
  </defs>
