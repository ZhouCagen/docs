    .tick { stroke: #444; stroke-width: 1.2; }
    .guide { fill: none; stroke: #777; stroke-width: 1.3; stroke-dasharray: 8 6; }
    .curve { fill: none; stroke: #222; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .point { fill: #222; }
    .leader { fill: none; stroke: #444; stroke-width: 1.5; marker-end: url(#arrow); }
    .band { fill: #efefef; }
    .caption { font-family: "Noto Serif CJK SC", "SimSun", serif; font-size: 24px; }
    .note { font-size: 17px; fill: #555; }
  </style>
