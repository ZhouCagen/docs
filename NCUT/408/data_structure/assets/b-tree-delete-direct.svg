<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc">
<title id="title">直接删除：删除 35 后仍满足下限</title><desc id="desc">5 阶 B 树中，非根、含关键字结点至少有 2 个关键字。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .key{font-size:28px;font-weight:500}</style>
<rect width="1000" height="270" rx="16" fill="white"/>
<rect x="1" y="1" width="998" height="268" rx="15" fill="none" stroke="#dbe2e9"/>
<text x="30" y="39" font-size="24" fill="#18232f" font-weight="700" text-anchor="start">直接删除：删除 35 后仍满足下限</text>
<text x="30" y="69" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">5 阶 B 树中，非根、含关键字结点至少有 2 个关键字。</text>
<rect x="219.0" y="112" width="162" height="58" rx="9" fill="#e8f5ed" stroke="#27805b" stroke-width="2.5"/>
<text x="246.0" y="151" font-size="28" fill="#27805b" font-weight="500" text-anchor="middle">25</text>
<path d="M273.0,122 L273.0,160" stroke="#64748b" stroke-width="2.2" fill="none"/>
<text x="300.0" y="151" font-size="28" fill="#27805b" font-weight="500" text-anchor="middle">30</text>
<rect x="331.0" y="117" width="46" height="48" rx="5" fill="#fdecec"/>
<path d="M327.0,122 L327.0,160" stroke="#64748b" stroke-width="2.2" fill="none"/>
<text x="354.0" y="151" font-size="28" fill="#b53e3e" font-weight="500" text-anchor="middle">35</text>
<path d="M339.0,135 L370.0,151" stroke="#b53e3e" stroke-width="2.3"/>
<path d="M414,141 L606,141" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
<text x="510" y="118" font-size="19" fill="#18232f" font-weight="400" text-anchor="middle">删除 35</text>
<rect x="646.0" y="112" width="108" height="58" rx="9" fill="#e8f5ed" stroke="#27805b" stroke-width="2.5"/>
<text x="673.0" y="151" font-size="28" fill="#27805b" font-weight="500" text-anchor="middle">25</text>
<path d="M700.0,122 L700.0,160" stroke="#64748b" stroke-width="2.2" fill="none"/>
<text x="727.0" y="151" font-size="28" fill="#27805b" font-weight="500" text-anchor="middle">30</text>
<text x="500" y="227" font-size="20" fill="#18232f" font-weight="400" text-anchor="middle">剩下 2 个关键字，无须借用或合并。</text>
</svg>
