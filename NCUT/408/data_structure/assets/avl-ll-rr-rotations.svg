<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">AVL 树：LL 与 RR 单旋转</title>
<desc id="desc">LL 型对根结点右旋，RR 型对根结点左旋；示例旋转后均以 20 为根，10 为左孩子，30 为右孩子。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#52657a" stroke-width="1.5"/></marker></defs>
<style>
text {font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;}
.heading {font-size:22px;font-weight:700;fill:#162c43;}
.label {font-size:16px;fill:#52657a;}
.action {font-size:17px;font-weight:600;fill:#162c43;}
.number {font-family:Arial,sans-serif;font-size:23px;fill:white;}
.edge {stroke:#6d8295;stroke-width:3;fill:none;}
.arrow {stroke:#52657a;stroke-width:2;fill:none;}
</style>
<rect width="1120" height="680" fill="#fff"/>
<g transform="translate(0,0)"><rect x="12" y="8" width="1096" height="320" rx="12" fill="#f7f9fc" stroke="#dce4ed"/><text x="36" y="44" class="heading" text-anchor="start">LL 型 · 右单旋</text><text x="36" y="73" class="label" text-anchor="start">依次插入：30，20，10</text><path d="M267.32,135.68 L232.68,170.32" class="edge"/><path d="M197.32,205.68 L162.68,240.32" class="edge"/><circle cx="285" cy="118" r="25" fill="#2466a6"/><text x="285" y="126" class="number" text-anchor="middle">30</text><circle cx="215" cy="188" r="25" fill="#2466a6"/><text x="215" y="196" class="number" text-anchor="middle">20</text><circle cx="145" cy="258" r="25" fill="#2466a6"/><text x="145" y="266" class="number" text-anchor="middle">10</text><path d="M430,180 H650" class="arrow" marker-end="url(#arrow)"/><text x="540.0" y="162" class="action" text-anchor="middle">对 30 右旋</text><path d="M855.66,138.48 L814.34,197.52" class="edge"/><path d="M884.34,138.48 L925.66,197.52" class="edge"/><circle cx="870" cy="118" r="25" fill="#147d64"/><text x="870" y="126" class="number" text-anchor="middle">20</text><circle cx="800" cy="218" r="25" fill="#147d64"/><text x="800" y="226" class="number" text-anchor="middle">10</text><circle cx="940" cy="218" r="25" fill="#147d64"/><text x="940" y="226" class="number" text-anchor="middle">30</text><text x="215" y="304" class="label" text-anchor="middle">调整前</text><text x="870" y="304" class="label" text-anchor="middle">调整后</text></g><g transform="translate(0,336)"><rect x="12" y="8" width="1096" height="320" rx="12" fill="#f7f9fc" stroke="#dce4ed"/><text x="36" y="44" class="heading" text-anchor="start">RR 型 · 左单旋</text><text x="36" y="73" class="label" text-anchor="start">依次插入：10，20，30</text><path d="M162.68,135.68 L197.32,170.32" class="edge"/><path d="M232.68,205.68 L267.32,240.32" class="edge"/><circle cx="145" cy="118" r="25" fill="#2466a6"/><text x="145" y="126" class="number" text-anchor="middle">10</text><circle cx="215" cy="188" r="25" fill="#2466a6"/><text x="215" y="196" class="number" text-anchor="middle">20</text><circle cx="285" cy="258" r="25" fill="#2466a6"/><text x="285" y="266" class="number" text-anchor="middle">30</text><path d="M430,180 H650" class="arrow" marker-end="url(#arrow)"/><text x="540.0" y="162" class="action" text-anchor="middle">对 10 左旋</text><path d="M855.66,138.48 L814.34,197.52" class="edge"/><path d="M884.34,138.48 L925.66,197.52" class="edge"/><circle cx="870" cy="118" r="25" fill="#147d64"/><text x="870" y="126" class="number" text-anchor="middle">20</text><circle cx="800" cy="218" r="25" fill="#147d64"/><text x="800" y="226" class="number" text-anchor="middle">10</text><circle cx="940" cy="218" r="25" fill="#147d64"/><text x="940" y="226" class="number" text-anchor="middle">30</text><text x="215" y="304" class="label" text-anchor="middle">调整前</text><text x="870" y="304" class="label" text-anchor="middle">调整后</text></g>
</svg>
