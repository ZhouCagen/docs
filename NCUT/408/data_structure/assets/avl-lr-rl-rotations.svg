.heading {font-size:22px;font-weight:700;fill:#162c43;}
.label {font-size:16px;fill:#52657a;}
.action {font-size:17px;font-weight:600;fill:#162c43;}
.number {font-family:Arial,sans-serif;font-size:23px;fill:white;}
.edge {stroke:#6d8295;stroke-width:3;fill:none;}
.arrow {stroke:#52657a;stroke-width:2;fill:none;}
</style>
