<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1125" viewBox="0 0 1080 1125" role="img" aria-labelledby="title desc">
<title id="title">快速排序第一趟划分：以 5 为基准的挖坑法六步过程</title>
<desc id="desc">初始序列5、2、8、1、7、3；暂存基准5，依次将3、8、1填入空位，最后在下标3填回5，得到3、2、1、5、7、8。</desc>
