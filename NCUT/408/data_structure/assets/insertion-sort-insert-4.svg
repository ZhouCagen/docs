<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">直接插入排序：将 4 插入有序区 2、5、8</title>
<desc id="desc">暂存4，比较8大于4后将8右移；比较5大于4后将5右移；比较2小于4后将4插入2之后，得到2、4、5、8，有序区扩大一个元素。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#3569a8" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18232f}.arrow{fill:none;stroke:#3569a8;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect x="1" y="1" width="1098" height="648" rx="16" fill="white" stroke="#dbe2e9"/>
<text x="30" y="42" font-size="27" text-anchor="start" style="fill:#18232f" font-weight="700">直接插入排序：将 4 插入有序区</text>
<text x="30" y="75" font-size="18" text-anchor="start" style="fill:#64748b" font-weight="400">第三趟示例：先暂存 4，从有序区末尾向前比较，比 4 大的元素依次右移。</text>
<text x="305" y="116" font-size="15" text-anchor="middle" style="fill:#64748b" font-weight="400">1</text>
<text x="429" y="116" font-size="15" text-anchor="middle" style="fill:#64748b" font-weight="400">2</text>
<text x="553" y="116" font-size="15" text-anchor="middle" style="fill:#64748b" font-weight="400">3</text>
<text x="677" y="116" font-size="15" text-anchor="middle" style="fill:#64748b" font-weight="400">4</text>
<text x="801" y="116" font-size="15" text-anchor="middle" style="fill:#64748b" font-weight="400">5</text>
<text x="940" y="116" font-size="16" text-anchor="middle" style="fill:#a65309" font-weight="400">暂存元素</text>
<text x="30" y="176" font-size="20" text-anchor="start" style="fill:#18232f" font-weight="500">插入前</text>
<rect x="250" y="140" width="110" height="58" rx="8" fill="#e8f5ed" stroke="#27805b" stroke-width="2"/>
<text x="305" y="179" font-size="28" text-anchor="middle" style="fill:#27805b" font-weight="600">2</text>
<rect x="374" y="140" width="110" height="58" rx="8" fill="#e8f5ed" stroke="#27805b" stroke-width="2"/>
<text x="429" y="179" font-size="28" text-anchor="middle" style="fill:#27805b" font-weight="600">5</text>
<rect x="498" y="140" width="110" height="58" rx="8" fill="#e8f5ed" stroke="#27805b" stroke-width="2"/>
<text x="553" y="179" font-size="28" text-anchor="middle" style="fill:#27805b" font-weight="600">8</text>
<rect x="622" y="140" width="110" height="58" rx="8" fill="#fff0ce" stroke="#a65309" stroke-width="2"/>
<text x="677" y="179" font-size="28" text-anchor="middle" style="fill:#a65309" font-weight="600">4</text>
<rect x="746" y="140" width="110" height="58" rx="8" fill="#f4f6fa" stroke="#64748b" stroke-width="2"/>
<text x="801" y="179" font-size="28" text-anchor="middle" style="fill:#64748b" font-weight="600">7</text>
<path d="M677 200 L677 214 L940 214 L940 243" class="arrow"/>
<text x="30" y="286" font-size="20" text-anchor="start" style="fill:#18232f" font-weight="500">8 &gt; 4，8 后移</text>
<rect x="250" y="250" width="110" height="58" rx="8" fill="#e8f5ed" stroke="#27805b" stroke-width="2"/>
<text x="305" y="289" font-size="28" text-anchor="middle" style="fill:#27805b" font-weight="600">2</text>
<rect x="374" y="250" width="110" height="58" rx="8" fill="#e8f5ed" stroke="#27805b" stroke-width="2"/>
<text x="429" y="289" font-size="28" text-anchor="middle" style="fill:#27805b" font-weight="600">5</text>
<rect x="498" y="250" width="110" height="58" rx="8" fill="#ffffff" stroke="#8b97a5" stroke-width="2" stroke-dasharray="6 4"/>
<text x="553" y="289" font-size="28" text-anchor="middle" style="fill:#8b97a5" font-weight="600">空位</text>
<rect x="622" y="250" width="110" height="58" rx="8" fill="#e8f5ed" stroke="#27805b" stroke-width="2"/>
<text x="677" y="289" font-size="28" text-anchor="middle" style="fill:#27805b" font-weight="600">8</text>
<rect x="746" y="250" width="110" height="58" rx="8" fill="#f4f6fa" stroke="#64748b" stroke-width="2"/>
<text x="801" y="289" font-size="28" text-anchor="middle" style="fill:#64748b" font-weight="600">7</text>
<rect x="885" y="250" width="110" height="58" rx="8" fill="#fff0ce" stroke="#a65309" stroke-width="2"/>
<text x="940" y="289" font-size="28" text-anchor="middle" style="fill:#a65309" font-weight="600">4</text>
<path d="M553 202 L553 220 L677 220 L677 243" class="arrow"/>
<text x="30" y="396" font-size="20" text-anchor="start" style="fill:#18232f" font-weight="500">5 &gt; 4，5 后移</text>
<rect x="250" y="360" width="110" height="58" rx="8" fill="#e8f5ed" stroke="#27805b" stroke-width="2"/>
<text x="305" y="399" font-size="28" text-anchor="middle" style="fill:#27805b" font-weight="600">2</text>
<rect x="374" y="360" width="110" height="58" rx="8" fill="#ffffff" stroke="#8b97a5" stroke-width="2" stroke-dasharray="6 4"/>
<text x="429" y="399" font-size="28" text-anchor="middle" style="fill:#8b97a5" font-weight="600">空位</text>
<rect x="498" y="360" width="110" height="58" rx="8" fill="#e8f5ed" stroke="#27805b" stroke-width="2"/>
<text x="553" y="399" font-size="28" text-anchor="middle" style="fill:#27805b" font-weight="600">5</text>
<rect x="622" y="360" width="110" height="58" rx="8" fill="#e8f5ed" stroke="#27805b" stroke-width="2"/>
<text x="677" y="399" font-size="28" text-anchor="middle" style="fill:#27805b" font-weight="600">8</text>
<rect x="746" y="360" width="110" height="58" rx="8" fill="#f4f6fa" stroke="#64748b" stroke-width="2"/>
<text x="801" y="399" font-size="28" text-anchor="middle" style="fill:#64748b" font-weight="600">7</text>
<rect x="885" y="360" width="110" height="58" rx="8" fill="#fff0ce" stroke="#a65309" stroke-width="2"/>
<text x="940" y="399" font-size="28" text-anchor="middle" style="fill:#a65309" font-weight="600">4</text>
<path d="M429 312 L429 330 L553 330 L553 353" class="arrow"/>
<text x="30" y="506" font-size="20" text-anchor="start" style="fill:#18232f" font-weight="500">2 &lt; 4，插入 4</text>
<rect x="250" y="470" width="110" height="58" rx="8" fill="#e8f5ed" stroke="#27805b" stroke-width="2"/>
<text x="305" y="509" font-size="28" text-anchor="middle" style="fill:#27805b" font-weight="600">2</text>
<rect x="374" y="470" width="110" height="58" rx="8" fill="#fff0ce" stroke="#a65309" stroke-width="2"/>
<text x="429" y="509" font-size="28" text-anchor="middle" style="fill:#a65309" font-weight="600">4</text>
<rect x="498" y="470" width="110" height="58" rx="8" fill="#e8f5ed" stroke="#27805b" stroke-width="2"/>
<text x="553" y="509" font-size="28" text-anchor="middle" style="fill:#27805b" font-weight="600">5</text>
<rect x="622" y="470" width="110" height="58" rx="8" fill="#e8f5ed" stroke="#27805b" stroke-width="2"/>
<text x="677" y="509" font-size="28" text-anchor="middle" style="fill:#27805b" font-weight="600">8</text>
<rect x="746" y="470" width="110" height="58" rx="8" fill="#f4f6fa" stroke="#64748b" stroke-width="2"/>
<text x="801" y="509" font-size="28" text-anchor="middle" style="fill:#64748b" font-weight="600">7</text>
<path d="M608 134 v70" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M732 464 v70" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="25" y="566" width="1050" height="56" rx="10" fill="#f3f6fa"/>
<text x="550" y="601" font-size="22" text-anchor="middle" style="fill:#18232f" font-weight="400">本趟结束：2、4、5、8 已有序；7 留待下一趟处理。</text>
</svg>
