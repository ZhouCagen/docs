<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="388" viewBox="0 0 1120 388" role="img" aria-labelledby="title desc">
<title id="title">红黑树插入：父红、叔红的变色过程</title><desc id="desc">红黑树插入调整的自行绘制示意图。黑色结点标 B，红色结点标 R。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#52657a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:700;fill:#162c43}.label{font-size:16px;fill:#52657a}.action{font-size:15px;fill:#162c43}.node{font-family:Arial,sans-serif;font-size:18px;fill:white}.edge{stroke:#6d8295;stroke-width:2.5;fill:none}</style>
<rect width="1120" height="388" fill="white"/>
<text x="36" y="30" class="label" text-anchor="start">B：黑色　 R：红色　 未画出的空孩子均为黑色 NIL</text><g transform="translate(0,48)"><rect x="12" y="8" width="1096" height="324" rx="12" fill="#f7f9fc" stroke="#dce4ed"/><text x="36" y="43" class="heading" text-anchor="start">父红、叔红：只变色，向上检查</text><text x="36" y="72" class="label" text-anchor="start">父和叔染黑，祖父染红；若祖父是根，最终将根染黑。</text><path d="M160.91,137.09 L129.09,168.91" class="edge"/><path d="M199.09,137.09 L230.91,168.91" class="edge"/><path d="M93.32,209.23 L71.68,236.77" class="edge"/><circle cx="180" cy="118" r="27" fill="#25364b"/><text x="180" y="124" class="node" text-anchor="middle">10B</text><circle cx="110" cy="188" r="27" fill="#bd3748"/><text x="110" y="194" class="node" text-anchor="middle">5R</text><circle cx="250" cy="188" r="27" fill="#bd3748"/><text x="250" y="194" class="node" text-anchor="middle">15R</text><circle cx="55" cy="258" r="27" fill="#bd3748"/><text x="55" y="264" class="node" text-anchor="middle">1R</text><path d="M325,182 H405" class="edge" marker-end="url(#arrow)"/><text x="365.0" y="157" class="action" text-anchor="middle">父叔黑，祖父红</text><path d="M530.91,137.09 L499.09,168.91" class="edge"/><path d="M569.09,137.09 L600.91,168.91" class="edge"/><path d="M463.32,209.23 L441.68,236.77" class="edge"/><circle cx="550" cy="118" r="27" fill="#bd3748"/><text x="550" y="124" class="node" text-anchor="middle">10R</text><circle cx="480" cy="188" r="27" fill="#25364b"/><text x="480" y="194" class="node" text-anchor="middle">5B</text><circle cx="620" cy="188" r="27" fill="#25364b"/><text x="620" y="194" class="node" text-anchor="middle">15B</text><circle cx="425" cy="258" r="27" fill="#bd3748"/><text x="425" y="264" class="node" text-anchor="middle">1R</text><path d="M695,182 H775" class="edge" marker-end="url(#arrow)"/><text x="735.0" y="157" class="action" text-anchor="middle">根染黑</text><path d="M910.91,137.09 L879.09,168.91" class="edge"/><path d="M949.09,137.09 L980.91,168.91" class="edge"/><path d="M843.32,209.23 L821.68,236.77" class="edge"/><circle cx="930" cy="118" r="27" fill="#25364b"/><text x="930" y="124" class="node" text-anchor="middle">10B</text><circle cx="860" cy="188" r="27" fill="#25364b"/><text x="860" y="194" class="node" text-anchor="middle">5B</text><circle cx="1000" cy="188" r="27" fill="#25364b"/><text x="1000" y="194" class="node" text-anchor="middle">15B</text><circle cx="805" cy="258" r="27" fill="#bd3748"/><text x="805" y="264" class="node" text-anchor="middle">1R</text></g></svg>
