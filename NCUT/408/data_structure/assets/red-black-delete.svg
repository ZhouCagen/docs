<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2096" viewBox="0 0 1120 2096" role="img" aria-labelledby="title desc">
<title id="title">红黑树删除：按手写笔记重绘</title>
<desc id="desc">展示红叶删除、黑结点被红孩子替换，以及删除黑叶后兄弟与侄子的四种调整情况。黑叶删除的例子均以待调整位置在父结点左侧为例。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#52657a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}.heading{font-size:21px;font-weight:700;fill:#162c43}.label{font-size:16px;fill:#52657a}.action{font-size:14px;fill:#162c43}.node{font-family:Arial,sans-serif;font-size:18px;fill:white}.edge{stroke:#6d8295;stroke-width:2.5;fill:none}</style>
<rect width="1120" height="2096" fill="white"/>
<text x="36" y="30" class="label" text-anchor="start">B：黑色　 R：红色　 双圈：双黑　 NIL：空叶结点</text><g transform="translate(0,48)"><rect x="12" y="8" width="1096" height="324" rx="12" fill="#f7f9fc" stroke="#dce4ed"/><text x="36" y="43" class="heading" text-anchor="start">1. 删除红色叶结点</text><text x="36" y="72" class="label" text-anchor="start">直接删除。</text><path d="M222.07,139.51 L182.93,186.49" class="edge"/><path d="M257.93,139.51 L297.07,186.49" class="edge"/><circle cx="240" cy="118" r="27" fill="#25364b"/><text x="240" y="124" class="node" text-anchor="middle">10B</text><circle cx="165" cy="208" r="27" fill="#bd3748"/><text x="165" y="214" class="node" text-anchor="middle">5R</text><circle cx="315" cy="208" r="27" fill="#bd3748"/><text x="315" y="214" class="node" text-anchor="middle">15R</text><path d="M450,176 H650" class="edge" marker-end="url(#arrow)"/><text x="550.0" y="151" class="action" text-anchor="middle">删除 5R</text><path d="M867.93,139.51 L907.07,186.49" class="edge"/><circle cx="850" cy="118" r="27" fill="#25364b"/><text x="850" y="124" class="node" text-anchor="middle">10B</text><circle cx="925" cy="208" r="27" fill="#bd3748"/><text x="925" y="214" class="node" text-anchor="middle">15R</text></g><g transform="translate(0,388)"><rect x="12" y="8" width="1096" height="324" rx="12" fill="#f7f9fc" stroke="#dce4ed"/><text x="36" y="43" class="heading" text-anchor="start">2. 黑结点只有一个红孩子</text><text x="36" y="72" class="label" text-anchor="start">用红孩子代替待删结点，并将红孩子染黑。</text><path d="M219.53,137.10 L185.47,168.90" class="edge"/><path d="M181.27,210.78 L198.73,235.22" class="edge"/><path d="M260.47,137.10 L294.53,168.90" class="edge"/><circle cx="240" cy="118" r="27" fill="#25364b"/><text x="240" y="124" class="node" text-anchor="middle">10B</text><circle cx="165" cy="188" r="27" fill="#25364b"/><text x="165" y="194" class="node" text-anchor="middle">5B</text><circle cx="215" cy="258" r="27" fill="#bd3748"/><text x="215" y="264" class="node" text-anchor="middle">7R</text><circle cx="315" cy="188" r="27" fill="#25364b"/><text x="315" y="194" class="node" text-anchor="middle">15B</text><path d="M450,176 H650" class="edge" marker-end="url(#arrow)"/><text x="550.0" y="151" class="action" text-anchor="middle">删除 5B，7 染黑</text><path d="M832.07,139.51 L792.93,186.49" class="edge"/><path d="M867.93,139.51 L907.07,186.49" class="edge"/><circle cx="850" cy="118" r="27" fill="#25364b"/><text x="850" y="124" class="node" text-anchor="middle">10B</text><circle cx="775" cy="208" r="27" fill="#25364b"/><text x="775" y="214" class="node" text-anchor="middle">7B</text><circle cx="925" cy="208" r="27" fill="#25364b"/><text x="925" y="214" class="node" text-anchor="middle">15B</text></g><g transform="translate(0,728)"><rect x="12" y="8" width="1096" height="324" rx="12" fill="#f7f9fc" stroke="#dce4ed"/><text x="36" y="43" class="heading" text-anchor="start">3①. 删除黑色叶结点：兄弟为红色</text><text x="36" y="72" class="label" text-anchor="start">兄弟染黑，父亲染红，对父亲左旋；转为兄弟为黑色的情况继续处理。</text><path d="M218.93,136.44 L181.07,169.56" class="edge"/><path d="M261.07,136.44 L298.93,169.56" class="edge"/><path d="M302.70,210.02 L282.30,235.98" class="edge"/><path d="M337.30,210.02 L357.70,235.98" class="edge"/><circle cx="240" cy="118" r="27" fill="#25364b"/><text x="240" y="124" class="node" text-anchor="middle">10B</text><circle cx="160" cy="188" r="32" fill="none" stroke="#d48016" stroke-width="3"/><circle cx="160" cy="188" r="27" fill="#25364b"/><text x="160" y="194" class="node" text-anchor="middle">NIL</text><circle cx="320" cy="188" r="27" fill="#bd3748"/><text x="320" y="194" class="node" text-anchor="middle">20R</text><circle cx="265" cy="258" r="27" fill="#25364b"/><text x="265" y="264" class="node" text-anchor="middle">15B</text><circle cx="375" cy="258" r="27" fill="#25364b"/><text x="375" y="264" class="node" text-anchor="middle">30B</text><path d="M450,176 H650" class="edge" marker-end="url(#arrow)"/><text x="550.0" y="151" class="action" text-anchor="middle">20 染黑，10 染红；左旋</text><path d="M848.93,136.44 L811.07,169.56" class="edge"/><path d="M891.07,136.44 L928.93,169.56" class="edge"/><path d="M772.70,210.02 L752.30,235.98" class="edge"/><path d="M807.30,210.02 L827.70,235.98" class="edge"/><circle cx="870" cy="118" r="27" fill="#25364b"/><text x="870" y="124" class="node" text-anchor="middle">20B</text><circle cx="790" cy="188" r="27" fill="#bd3748"/><text x="790" y="194" class="node" text-anchor="middle">10R</text><circle cx="950" cy="188" r="27" fill="#25364b"/><text x="950" y="194" class="node" text-anchor="middle">30B</text><circle cx="735" cy="258" r="32" fill="none" stroke="#d48016" stroke-width="3"/><circle cx="735" cy="258" r="27" fill="#25364b"/><text x="735" y="264" class="node" text-anchor="middle">NIL</text><circle cx="845" cy="258" r="27" fill="#25364b"/><text x="845" y="264" class="node" text-anchor="middle">15B</text></g><g transform="translate(0,1068)"><rect x="12" y="8" width="1096" height="324" rx="12" fill="#f7f9fc" stroke="#dce4ed"/><text x="36" y="43" class="heading" text-anchor="start">3②(1). 兄弟为黑色，两个侄子均为黑色</text><text x="36" y="72" class="label" text-anchor="start">兄弟染红，双黑上移至父结点；图中父结点为根，最终消去额外黑色。</text><path d="M163.61,140.70 L131.39,185.30" class="edge"/><path d="M196.39,140.70 L228.61,185.30" class="edge"/><circle cx="180" cy="118" r="27" fill="#25364b"/><text x="180" y="124" class="node" text-anchor="middle">10B</text><circle cx="115" cy="208" r="32" fill="none" stroke="#d48016" stroke-width="3"/><circle cx="115" cy="208" r="27" fill="#25364b"/><text x="115" y="214" class="node" text-anchor="middle">NIL</text><circle cx="245" cy="208" r="27" fill="#25364b"/><text x="245" y="214" class="node" text-anchor="middle">15B</text><path d="M325,176 H405" class="edge" marker-end="url(#arrow)"/><text x="365.0" y="151" class="action" text-anchor="middle">兄弟染红，双黑上移</text><path d="M533.61,140.70 L501.39,185.30" class="edge"/><path d="M566.39,140.70 L598.61,185.30" class="edge"/><circle cx="550" cy="118" r="32" fill="none" stroke="#d48016" stroke-width="3"/><circle cx="550" cy="118" r="27" fill="#25364b"/><text x="550" y="124" class="node" text-anchor="middle">10B</text><circle cx="485" cy="208" r="27" fill="#25364b"/><text x="485" y="214" class="node" text-anchor="middle">NIL</text><circle cx="615" cy="208" r="27" fill="#bd3748"/><text x="615" y="214" class="node" text-anchor="middle">15R</text><path d="M695,176 H775" class="edge" marker-end="url(#arrow)"/><text x="735.0" y="151" class="action" text-anchor="middle">根消去额外黑色</text><path d="M913.61,140.70 L881.39,185.30" class="edge"/><path d="M946.39,140.70 L978.61,185.30" class="edge"/><circle cx="930" cy="118" r="27" fill="#25364b"/><text x="930" y="124" class="node" text-anchor="middle">10B</text><circle cx="865" cy="208" r="27" fill="#25364b"/><text x="865" y="214" class="node" text-anchor="middle">NIL</text><circle cx="995" cy="208" r="27" fill="#bd3748"/><text x="995" y="214" class="node" text-anchor="middle">15R</text></g><g transform="translate(0,1408)"><rect x="12" y="8" width="1096" height="324" rx="12" fill="#f7f9fc" stroke="#dce4ed"/><text x="36" y="43" class="heading" text-anchor="start">3②(2). 兄弟为黑色，近侄红、远侄黑</text><text x="36" y="72" class="label" text-anchor="start">近侄染黑，兄弟染红，对兄弟右旋；转为远侄红的情况继续处理。</text><path d="M160.20,137.80 L129.80,168.20" class="edge"/><path d="M199.80,137.80 L230.20,168.20" class="edge"/><path d="M232.70,210.02 L212.30,235.98" class="edge"/><circle cx="180" cy="118" r="27" fill="#25364b"/><text x="180" y="124" class="node" text-anchor="middle">10B</text><circle cx="110" cy="188" r="32" fill="none" stroke="#d48016" stroke-width="3"/><circle cx="110" cy="188" r="27" fill="#25364b"/><text x="110" y="194" class="node" text-anchor="middle">NIL</text><circle cx="250" cy="188" r="27" fill="#25364b"/><text x="250" y="194" class="node" text-anchor="middle">20B</text><circle cx="195" cy="258" r="27" fill="#bd3748"/><text x="195" y="264" class="node" text-anchor="middle">15R</text><path d="M330,176 H410" class="edge" marker-end="url(#arrow)"/><text x="370.0" y="151" class="action" text-anchor="middle">15 染黑，20 染红；右旋</text><path d="M530.20,137.80 L499.80,168.20" class="edge"/><path d="M569.80,137.80 L600.20,168.20" class="edge"/><path d="M637.30,210.02 L657.70,235.98" class="edge"/><circle cx="550" cy="118" r="27" fill="#25364b"/><text x="550" y="124" class="node" text-anchor="middle">10B</text><circle cx="480" cy="188" r="32" fill="none" stroke="#d48016" stroke-width="3"/><circle cx="480" cy="188" r="27" fill="#25364b"/><text x="480" y="194" class="node" text-anchor="middle">NIL</text><circle cx="620" cy="188" r="27" fill="#25364b"/><text x="620" y="194" class="node" text-anchor="middle">15B</text><circle cx="675" cy="258" r="27" fill="#bd3748"/><text x="675" y="264" class="node" text-anchor="middle">20R</text><path d="M730,176 H810" class="edge" marker-end="url(#arrow)"/><text x="770.0" y="151" class="action" text-anchor="middle">按远侄红处理</text><path d="M933.61,140.70 L901.39,185.30" class="edge"/><path d="M966.39,140.70 L998.61,185.30" class="edge"/><circle cx="950" cy="118" r="27" fill="#25364b"/><text x="950" y="124" class="node" text-anchor="middle">15B</text><circle cx="885" cy="208" r="27" fill="#25364b"/><text x="885" y="214" class="node" text-anchor="middle">10B</text><circle cx="1015" cy="208" r="27" fill="#25364b"/><text x="1015" y="214" class="node" text-anchor="middle">20B</text></g><g transform="translate(0,1748)"><rect x="12" y="8" width="1096" height="324" rx="12" fill="#f7f9fc" stroke="#dce4ed"/><text x="36" y="43" class="heading" text-anchor="start">3②(3). 兄弟为黑色，远侄为红色</text><text x="36" y="72" class="label" text-anchor="start">远侄染黑，兄弟继承父结点颜色，父结点染黑，对父结点左旋。</text><path d="M218.93,136.44 L181.07,169.56" class="edge"/><path d="M261.07,136.44 L298.93,169.56" class="edge"/><path d="M337.30,210.02 L357.70,235.98" class="edge"/><circle cx="240" cy="118" r="27" fill="#25364b"/><text x="240" y="124" class="node" text-anchor="middle">10B</text><circle cx="160" cy="188" r="32" fill="none" stroke="#d48016" stroke-width="3"/><circle cx="160" cy="188" r="27" fill="#25364b"/><text x="160" y="194" class="node" text-anchor="middle">NIL</text><circle cx="320" cy="188" r="27" fill="#25364b"/><text x="320" y="194" class="node" text-anchor="middle">15B</text><circle cx="375" cy="258" r="27" fill="#bd3748"/><text x="375" y="264" class="node" text-anchor="middle">20R</text><path d="M450,176 H650" class="edge" marker-end="url(#arrow)"/><text x="550.0" y="151" class="action" text-anchor="middle">染色后，对 10 左旋</text><path d="M852.07,139.51 L812.93,186.49" class="edge"/><path d="M887.93,139.51 L927.07,186.49" class="edge"/><circle cx="870" cy="118" r="27" fill="#25364b"/><text x="870" y="124" class="node" text-anchor="middle">15B</text><circle cx="795" cy="208" r="27" fill="#25364b"/><text x="795" y="214" class="node" text-anchor="middle">10B</text><circle cx="945" cy="208" r="27" fill="#25364b"/><text x="945" y="214" class="node" text-anchor="middle">20B</text></g></svg>
